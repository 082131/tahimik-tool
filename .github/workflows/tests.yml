# =============================================================================
# Runs the TAHIMIK test suite on every push and pull request.
#
# A red X on a pull request means the change broke something. Do not merge
# until it is green.
#
# Torch is installed from PyTorch's CPU index first. The default wheel on PyPI
# bundles CUDA and is several gigabytes — the runner has no GPU, so the CPU
# build is both correct and far faster. Installing it before requirements.txt
# means pip sees `torch` already satisfied and skips the large download.
# =============================================================================

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false     # report every failing version, not just the first
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip       # reuse the wheel cache between runs

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run the test suite
        run: python -m pytest tests/ -v
